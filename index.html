<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maqueta 3D · Casco</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --col-mesa:     #d4a853;
  --col-pista:    #4a7fb5;
  --col-barra:    #8a5c35;
  --col-comida:   #5a8a5a;
  --col-deco:     #9a5a8a;
  --col-bombita:  #ffcc44;
  --col-bebedero: #4aacdc;
  --col-otro:     #6a6a6a;
}

body {
  font-family: 'Courier New', monospace;
  background: #050505;
  color: #ddd;
  height: 100dvh;
  display: flex;
  overflow: hidden;
}

/* ── VIEWPORT ── */
#map-wrap {
  flex: 1;
  min-width: 0;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

#map-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 10px;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: #555;
  flex-shrink: 0;
}

#top-controls { display: flex; align-items: center; gap: 10px; }
#view-tabs { display: flex; gap: 4px; }
.mode-btn {
  background: #161616;
  border: 1px solid #262626;
  color: #999;
  font-family: inherit;
  font-size: 9px;
  letter-spacing: .08em;
  text-transform: uppercase;
  padding: 5px 10px;
  border-radius: 3px;
  cursor: pointer;
  transition: opacity .15s, border-color .15s, color .15s, background .15s;
  white-space: nowrap;
}
.mode-btn:hover { border-color: #3a3a3a; }
.mode-btn[data-mode="items"] { border-color: #9a7a50; color: #d8c090; background: #201a10; }
.view-tab {
  background: #161616;
  border: 1px solid #262626;
  color: #777;
  font-family: inherit;
  font-size: 9px;
  letter-spacing: .1em;
  text-transform: uppercase;
  padding: 5px 9px;
  border-radius: 3px;
  cursor: pointer;
  transition: opacity .15s, border-color .15s, color .15s;
}
.view-tab:hover  { border-color: #3a3a3a; color: #aaa; }
.view-tab.active { border-color: #9a7a50; color: #d8c090; background: #201a10; }

#three-wrap {
  flex: 1;
  position: relative;
  min-height: 0;
  border-radius: 6px;
  overflow: hidden;
  background: #030303;
}

#three-canvas-host { position: absolute; inset: 0; }
#three-canvas-host canvas { display: block; }

#label-layer {
  position: absolute; inset: 0;
  pointer-events: none;
  overflow: hidden;
}

.lbl-static {
  position: absolute;
  top: 0; left: 0;
  font-family: 'Courier New', monospace;
  white-space: nowrap;
  pointer-events: none;
  transform: translate(-50%, -100%);
  text-shadow: 0 1px 3px rgba(0,0,0,.9), 0 0 8px rgba(0,0,0,.6);
  font-size: 9px;
  color: #7a8a68;
  letter-spacing: .1em;
  text-transform: uppercase;
}

/* HUD: compass */
#hud-compass {
  position: absolute; top: 14px; right: 14px;
  width: 44px; height: 44px;
  pointer-events: none;
}
#hud-compass svg { width: 100%; height: 100%; display: block; }

/* HUD: scale bar */
#hud-scale {
  position: absolute; left: 14px; bottom: 14px;
  display: flex; align-items: center; gap: 6px;
  font-size: 9px; color: #666;
  pointer-events: none;
}
#hud-scale .bar { display: flex; height: 4px; }
#hud-scale .seg { width: 18px; }
#hud-scale .seg:nth-child(odd)  { background: #777; }
#hud-scale .seg:nth-child(even) { background: #333; }

#hud-hint {
  position: absolute; right: 14px; bottom: 14px;
  font-size: 9px; color: #444;
  letter-spacing: .04em;
  pointer-events: none;
  text-align: right;
}

#hud-loading {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; letter-spacing: .15em; text-transform: uppercase; color: #555;
  background: #030303;
  transition: opacity .4s ease;
}

/* ── SIDEBAR ── */
#sidebar {
  width: 288px;
  flex-shrink: 0;
  background: #181818;
  border-left: 1px solid #252525;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

#sidebar-scroll {
  flex: 1;
  overflow-y: auto;
  padding: 16px 14px;
  display: flex;
  flex-direction: column;
  gap: 18px;
}

.s-section { display: flex; flex-direction: column; gap: 8px; }

.s-title {
  font-size: 9px;
  letter-spacing: .2em;
  text-transform: uppercase;
  color: #555;
  padding-bottom: 7px;
  border-bottom: 1px solid #222;
}

label {
  display: flex;
  flex-direction: column;
  gap: 3px;
  font-size: 10px;
  color: #666;
}

select, input {
  background: #222;
  border: 1px solid #2e2e2e;
  border-radius: 3px;
  color: #ddd;
  font-family: inherit;
  font-size: 12px;
  padding: 6px 8px;
  outline: none;
  width: 100%;
}
select:focus, input:focus { border-color: #9a7a50; }
input:disabled { opacity: .38; cursor: not-allowed; }

.frow { display: flex; gap: 6px; }
.frow label { flex: 1; }

.btn {
  border: none;
  border-radius: 3px;
  font-family: inherit;
  font-size: 11px;
  padding: 7px 10px;
  cursor: pointer;
  text-align: center;
  transition: opacity .15s;
  white-space: nowrap;
}
.btn:hover { opacity: .8; }
.btn-add   { background: #9a7a50; color: #f0e8d8; width: 100%; }
.btn-sm    { padding: 5px 8px; font-size: 10px; }
.btn-ghost { background: #232323; color: #aaa; border: 1px solid #2e2e2e; flex: 1; }
.btn-del   { background: #3e1818; color: #e0a0a0; flex: 1; }
.btn-clear { background: #2a1414; color: #b07070; border: 1px solid #3a2020; width: 100%; }

/* Selected panel */
#sel-panel          { display: none; }
#sel-panel.visible  { display: flex; flex-direction: column; gap: 8px; }
#sel-name { font-size: 12px; color: #ccc; }
#sel-dims { font-size: 10px; color: #666; }

/* Item list */
.item-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 5px 7px;
  border-radius: 3px;
  background: #202020;
  border: 1px solid transparent;
  cursor: pointer;
}
.item-row:hover  { border-color: #2e2e2e; }
.item-row.active { border-color: #9a7a50; }

.item-dot  { width: 9px; height: 9px; border-radius: 2px; flex-shrink: 0; }
.item-text { flex: 1; min-width: 0; }
.item-lbl  { font-size: 11px; color: #ccc; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item-sub  { font-size: 9px; color: #555; }

/* Stats */
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.stat-card { background: #1e1e1e; border-radius: 3px; padding: 10px; text-align: center; }
.stat-n { font-size: 22px; font-weight: bold; }
.stat-l { font-size: 9px; color: #555; margin-top: 2px; }

.empty { font-size: 10px; color: #444; text-align: center; padding: 10px; }

/* ── SIDEBAR GRUPOS ── */
.item-group { margin-bottom: 3px; }
.group-hdr {
  display: flex; align-items: center; gap: 6px;
  padding: 5px 7px; border-radius: 3px;
  background: #1c1c1c; cursor: pointer; user-select: none;
  border: 1px solid transparent;
}
.group-hdr:hover { border-color: #2e2e2e; }
.group-dot  { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }
.group-name { flex: 1; font-size: 9px; color: #777; letter-spacing: .1em; text-transform: uppercase; }
.group-cnt  { font-size: 9px; color: #555; background: #242424; padding: 1px 5px; border-radius: 10px; }
.group-chev { font-size: 9px; color: #444; transition: transform .18s; }
.group-hdr.closed .group-chev { transform: rotate(-90deg); }
.group-body { padding-left: 6px; }
.group-body.closed { display: none; }
.item-row   { margin-bottom: 2px; }

.btn-lights-on  { background: #2a2a10; color: #e8e060; border: 1px solid #5a5a18; flex: 1; }
.btn-lights-off { background: #232323; color: #666; border: 1px solid #2e2e2e; flex: 1; }
.btn-night  { background: #12122a; color: #7070b8; border: 1px solid #28285a; width: 100%; }
.btn-night.on  { background: #1e1e48; color: #a0a0e0; border-color: #4848a0; }

#hint {
  padding: 8px 14px;
  font-size: 9px;
  color: #3a3a3a;
  border-top: 1px solid #1e1e1e;
  letter-spacing: .04em;
  flex-shrink: 0;
}
</style>
</head>
<body>

<!-- ═══ 3D VIEWPORT ═══ -->
<div id="map-wrap">
  <div id="map-top">
    <span>CASCO &nbsp;·&nbsp; MAQUETA 3D &nbsp;·&nbsp; 54 × 44 m</span>
    <div id="top-controls">
      <button class="mode-btn" id="btn-mode" data-mode="camera">🎥 Mover cámara</button>
      <div id="view-tabs">
        <button class="view-tab" data-view="persp">Perspectiva</button>
        <button class="view-tab" data-view="top">Planta</button>
        <button class="view-tab" data-view="front">Frente</button>
        <button class="view-tab" data-view="side">Lateral</button>
      </div>
    </div>
  </div>
  <div id="three-wrap">
    <div id="three-canvas-host"></div>
    <div id="label-layer"></div>
    <div id="hud-compass">
      <svg viewBox="0 0 44 44">
        <circle cx="22" cy="22" r="19" fill="none" stroke="#3a3a3a" stroke-width="1"/>
        <g id="hud-needle">
          <polygon points="22,5 27,24 22,20 17,24" fill="#9a8060"/>
          <text x="22" y="3" text-anchor="middle" font-size="7" fill="#8a8a8a" font-family="Courier New">N</text>
        </g>
      </svg>
    </div>
    <div id="hud-scale">
      <div class="bar"><div class="seg"></div><div class="seg"></div></div>
      <span>10 m</span>
    </div>
    <div id="hud-hint"></div>
    <div id="hud-loading">Cargando maqueta…</div>
  </div>
</div>

<!-- ═══ SIDEBAR ═══ -->
<div id="sidebar">
  <div id="sidebar-scroll">

    <!-- ADD -->
    <div class="s-section">
      <div class="s-title">Agregar ítem</div>

      <label>Tipo
        <select id="i-type">
          <option value="mesa">Mesa</option>
          <option value="mesaimp">Mesa Imperial (3×1 · 8p)</option>
          <option value="pista">Pista de baile</option>
          <option value="barra">Barra</option>
          <option value="comida">Sector comida</option>
          <option value="deco">Decoración</option>
          <option value="bombita">Bombita LED</option>
          <option value="bebedero">Bebedero</option>
          <option value="reflector">Reflector</option>
          <option value="cuina">Cuina Catering</option>
          <option value="vela">Vela de piso</option>
          <option value="livingf">Living Gervasioni chico</option>
          <option value="barrafardos">Barra de fardos</option>
          <option value="living">Living Gervasioni</option>
          <option value="sanitario">Baño VIP (6.5×4 m · 5 compartimentos)</option>
          <option value="tractor">Tractor</option>
          <option value="dj">Cabina DJ</option>
          <option value="trussdj">Andamio de luces (arco)</option>
          <option value="fardo">Fardo (1.20 × 0.80 m)</option>
          <option value="fogonero">Fogonero (1.20 × 1.20 m · fuego)</option>
          <option value="tronco">Árbol caído / Tronco (≈5 m)</option>
          <option value="rondafardos">Ronda de fardos (círculo · 20 u)</option>
          <option value="kermess">Luces Kermess (círculo · 10 u)</option>
          <option value="texto">Texto / Referencia</option>
          <option value="otro">Otro</option>
        </select>
      </label>

      <label>Nombre
        <input type="text" id="i-label" placeholder="Mesa 1" autocomplete="off">
      </label>

      <div class="frow">
        <label>Ancho (m)
          <input type="number" id="i-w" value="2" min=".5" max="30" step=".5">
        </label>
        <label>Largo (m)
          <input type="number" id="i-h" value="2" min=".5" max="30" step=".5">
        </label>
      </div>

      <button class="btn btn-add" id="btn-add">+ Agregar al mapa</button>
    </div>

    <!-- SELECTED -->
    <div class="s-section" id="sel-panel">
      <div class="s-title">Seleccionado</div>
      <div id="sel-name"></div>
      <div id="sel-dims"></div>
      <div class="frow">
        <button class="btn btn-ghost btn-sm" id="btn-rl">↺ &minus;15°</button>
        <button class="btn btn-ghost btn-sm" id="btn-rr">↻ +15°</button>
      </div>
      <div class="frow" id="lights-row" style="display:none">
        <button class="btn btn-lights-off btn-sm" id="btn-lights">💡 Luces OFF</button>
      </div>
      <div class="frow">
        <button class="btn btn-ghost btn-sm" id="btn-dup">⧉ Duplicar</button>
        <button class="btn btn-del  btn-sm" id="btn-del">✕ Eliminar</button>
      </div>
    </div>

    <!-- LIST -->
    <div class="s-section">
      <div class="s-title">En el mapa (<span id="item-count">0</span>)</div>
      <div id="item-list"><div class="empty">Sin ítems todavía</div></div>
    </div>

    <!-- STATS -->
    <div class="s-section">
      <div class="s-title">Resumen</div>
      <div class="stats" id="stats">
        <div class="empty" style="grid-column:1/-1">—</div>
      </div>
    </div>

    <!-- NIGHT -->
    <div class="s-section">
      <button class="btn btn-night" id="btn-night">☾ &nbsp;Bajar luz</button>
    </div>

    <!-- CLEAR -->
    <div class="s-section">
      <button class="btn btn-clear btn-sm" id="btn-clear">Limpiar todo</button>
    </div>

  </div>
  <div id="hint">
    R&nbsp;=&nbsp;rotar &nbsp;·&nbsp; D&nbsp;=&nbsp;duplicar &nbsp;·&nbsp; Supr&nbsp;=&nbsp;eliminar &nbsp;·&nbsp; Esc&nbsp;=&nbsp;deseleccionar
  </div>
</div>

<script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
'use strict';

/* ════════════════════════════════════════════════════════════
   CONFIG
   ════════════════════════════════════════════════════════════ */
const TYPES = {
  mesa:        { label: 'Mesa',              color: '#d4a853', fg: '#1a0e00' },
  mesaimp:     { label: 'Mesa Imperial',     color: '#e8e4d8', fg: '#2a2418' },
  pista:       { label: 'Pista de baile',    color: '#b87840', fg: '#1a0800' },
  barra:       { label: 'Barra',             color: '#8a5c35', fg: '#f0e8d8' },
  comida:      { label: 'Sector comida',     color: '#5a8a5a', fg: '#e0f0e0' },
  deco:        { label: 'Decoración',        color: '#9a5a8a', fg: '#f8e0f8' },
  bombita:     { label: 'Bombita LED',       color: '#ffcc44', fg: '#3a2800' },
  bebedero:    { label: 'Bebedero',          color: '#4aacdc', fg: '#001828' },
  reflector:   { label: 'Reflector',         color: '#e8e0a0', fg: '#1a1800' },
  cuina:       { label: 'Cuina Catering',    color: '#c8a040', fg: '#1a1000' },
  barrafardos: { label: 'Barra de fardos',   color: '#c8b060', fg: '#1a1200' },
  living:      { label: 'Living Gervasioni', color: '#e8e4d6', fg: '#1a1810' },
  livingf:     { label: 'Living Gervasioni chico', color: '#e8e4d6', fg: '#1a1810' },
  vela:        { label: 'Vela de piso',      color: '#f0a828', fg: '#1a0800' },
  sanitario:   { label: 'Baño VIP',          color: '#d4a870', fg: '#1a0e00' },
  tractor:     { label: 'Tractor',           color: '#c0392b', fg: '#fff0ee' },
  dj:          { label: 'Cabina DJ',         color: '#7040c0', fg: '#f0e8ff' },
  trussdj:     { label: 'Andamio de luces',   color: '#1c1c1c', fg: '#f0e8ff' },
  fardo:       { label: 'Fardo',             color: '#c7a13e', fg: '#1a1400' },
  fogonero:    { label: 'Fogonero',          color: '#d2691e', fg: '#fff0e0' },
  tronco:      { label: 'Árbol caído',       color: '#7a5230', fg: '#f0e2d0' },
  rondafardos: { label: 'Ronda de fardos',   color: '#cbbd72', fg: '#1a1400' },
  kermess:     { label: 'Luces Kermess',     color: '#ffcc44', fg: '#3a2800' },
  texto:       { label: 'Texto',             color: '#1a1a1a', fg: '#ffffff' },
  otro:        { label: 'Otro',              color: '#6a6a6a', fg: '#f0f0f0' },
};

const FW = 54, FH = 44;          // dimensiones del campo (m)
const KEY = 'casco-maqueta-v1';
const toWX = x => x - FW / 2;    // plano (x,y en metros) → mundo 3D (X,Z)
const toWZ = y => y - FH / 2;

/* ════════════════════════════════════════════════════════════
   STATE
   ════════════════════════════════════════════════════════════ */
let S = { items: [], selId: null, nextId: 1 };
let groupStates = {};

function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(_) {} }
function load() {
  try {
    const d = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (d && Array.isArray(d.items)) S = d;
  } catch(_) {}
}
load();

/* ════════════════════════════════════════════════════════════
   THREE.JS SETUP
   ════════════════════════════════════════════════════════════ */
const host = document.getElementById('three-canvas-host');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050505);
scene.fog = new THREE.FogExp2(0x050505, 0.0068);

// dos cámaras: perspectiva (perspectiva/frente/lateral) y ortográfica (planta,
// sin distorsión de lente — como un plano de arquitecto real)
const perspCamera = new THREE.PerspectiveCamera(42, 1, 0.1, 500);
const orthoCamera  = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 500);
let camera = perspCamera;

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
// la escena (casco + ítems) es estática entre cambios: recalcular el mapa de
// sombras en cada uno de los 60 cuadros por segundo era el costo más alto de
// la maqueta. Se recalcula solo cuando algo realmente cambió (ver render()).
renderer.shadowMap.autoUpdate = false;
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
host.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 8;
controls.maxDistance = 95;
controls.maxPolarAngle = Math.PI / 2 - 0.02;
controls.minPolarAngle = 0.02;
controls.target.set(0, 1, 0);
controls.screenSpacePanning = true;

function resize() {
  const w = host.clientWidth, h = host.clientHeight;
  if (!w || !h) return;
  const aspect = w / h;
  perspCamera.aspect = aspect;
  perspCamera.updateProjectionMatrix();
  const halfV = Math.max(FW, FH) / 2 + 6;
  if (aspect >= 1) {
    orthoCamera.left = -halfV*aspect; orthoCamera.right = halfV*aspect;
    orthoCamera.top = halfV; orthoCamera.bottom = -halfV;
  } else {
    orthoCamera.left = -halfV; orthoCamera.right = halfV;
    orthoCamera.top = halfV/aspect; orthoCamera.bottom = -halfV/aspect;
  }
  orthoCamera.updateProjectionMatrix();
  renderer.setSize(w, h);
}
window.addEventListener('resize', resize);

/* ── LIGHTING ── */
const hemi = new THREE.HemisphereLight(0x9fb8d8, 0x28241a, 0.9);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xfff2d8, 1.15);
sun.position.set(26, 38, 18);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.camera.left = -40; sun.shadow.camera.right = 40;
sun.shadow.camera.top = 34;   sun.shadow.camera.bottom = -34;
sun.shadow.camera.near = 1;   sun.shadow.camera.far = 120;
sun.shadow.bias = -0.0009;
sun.shadow.radius = 3;
scene.add(sun);

const fill = new THREE.DirectionalLight(0x6a80c0, 0.28);
fill.position.set(-24, 16, -20);
scene.add(fill);

const nightLights = [];  // { light, baseIntensity }
function addNightLight(light, intensity) {
  light.intensity = 0;
  scene.add(light);
  nightLights.push({ light, intensity });
  return light;
}

const flickerMats = []; // { m, base, speed, phase, prop }
function registerFlicker(m, base, speed, prop) {
  flickerMats.push({ m, base, speed, phase: Math.random()*10, prop: prop || 'emissiveIntensity' });
}

/* ════════════════════════════════════════════════════════════
   TEXTURES (canvas-generated, no external assets)
   ════════════════════════════════════════════════════════════ */
function canvasTex(size, draw, repeatX, repeatY) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  draw(ctx, size);
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(repeatX || 1, repeatY || 1);
  tex.encoding = THREE.sRGBEncoding;
  return tex;
}

const woodTopTex = canvasTex(512, (ctx, s) => {
  ctx.fillStyle = '#c9a877';
  ctx.fillRect(0, 0, s, s);
  for (let i = 0; i < 70; i++) {
    const y = Math.random() * s;
    ctx.strokeStyle = `rgba(${90+Math.random()*40|0},${60+Math.random()*30|0},${28+Math.random()*20|0},${0.06+Math.random()*0.1})`;
    ctx.lineWidth = 1 + Math.random() * 2.4;
    ctx.beginPath();
    ctx.moveTo(0, y);
    for (let x = 0; x <= s; x += 32) ctx.lineTo(x, y + (Math.random() - 0.5) * 10);
    ctx.stroke();
  }
  for (let i = 0; i < 900; i++) {
    ctx.fillStyle = `rgba(60,40,20,${Math.random()*0.05})`;
    ctx.fillRect(Math.random()*s, Math.random()*s, 1, 1);
  }
}, 5, 4);

const woodSideTex = canvasTex(256, (ctx, s) => {
  ctx.fillStyle = '#b89468';
  ctx.fillRect(0, 0, s, s);
  for (let i = 0; i < 40; i++) {
    const x = Math.random() * s;
    ctx.strokeStyle = `rgba(70,46,22,${0.08+Math.random()*0.12})`;
    ctx.lineWidth = 1 + Math.random();
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x + (Math.random()-0.5)*6, s); ctx.stroke();
  }
}, 6, 1);

const grassTex = canvasTex(512, (ctx, s) => {
  // pasto de campo real: base pareja pero con manchas suaves de desgaste/seco,
  // como en el potrero de las fotos (no sintético/parejo tipo cancha)
  ctx.fillStyle = '#4c7228';
  ctx.fillRect(0, 0, s, s);
  // manchas grandes y suaves, más secas/claras, tipo pasto pisado o falta de riego
  for (let i = 0; i < 22; i++) {
    const x = Math.random()*s, y = Math.random()*s, r = 40 + Math.random()*90;
    const grad = ctx.createRadialGradient(x,y,0,x,y,r);
    const dry = Math.random() > 0.5;
    grad.addColorStop(0, dry ? 'rgba(150,140,80,0.16)' : 'rgba(50,90,26,0.14)');
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
  }
  for (let i = 0; i < 500; i++) {
    const g = 150 + Math.random()*40 | 0;
    ctx.fillStyle = `rgba(${g*0.45|0},${g|0},${g*0.26|0},${0.02+Math.random()*0.03})`;
    ctx.fillRect(Math.random()*s, Math.random()*s, 2, 2);

const danceTileTex = canvasTex(256, (ctx, s) => {
  ctx.fillStyle = '#2a2018';
  ctx.fillRect(0,0,s,s);
  const tiles = 6, ts = s/tiles;
  for (let i=0;i<tiles;i++) for (let j=0;j<tiles;j++) {
    ctx.fillStyle = (i+j)%2===0 ? '#3a2c1e' : '#332616';
    ctx.fillRect(i*ts, j*ts, ts-2, ts-2);
  }
}, 1, 1);

const gravelTex = canvasTex(256, (ctx, s) => {
  ctx.fillStyle = '#9a8f78';
  ctx.fillRect(0,0,s,s);
  for (let i=0;i<1600;i++) {

    const x=Math.random()*s, y=Math.random()*s, r=0.8+Math.random()*2.2;

/* ════════════════════════════════════════════════════════════
   GEOMETRY HELPERS
   ════════════════════════════════════════════════════════════ */
function mat(color, opts) {
  return new THREE.MeshStandardMaterial(Object.assign({
    color, roughness: 0.82, metalness: 0.04, flatShading: true,
  }, opts || {}));
}
function mesh(geo, m, x, y, z) {
  const o = new THREE.Mesh(geo, m);
  o.castShadow = o.receiveShadow = true;
  if (x !== undefined) o.position.set(x, y, z);
  return o;
}
// versión sin sombra propia, para follaje/enredaderas/flores repetidas
// (muchísimas piezas chicas — proyectar sombra de cada una es el costo más
// alto de rendimiento y casi no se nota visualmente)
function meshLite(geo, m, x, y, z) {
  const o = new THREE.Mesh(geo, m);
  o.castShadow = false;
  o.receiveShadow = false;
  if (x !== undefined) o.position.set(x, y, z);
  return o;
}
function group(...children) {
  const g = new THREE.Group();
  children.forEach(c => c && g.add(c));
  return g;
}

function makeTree(canopyR, trunkH, canopyColor, style) {
  const g = new THREE.Group();
  const trunk = mesh(
    new THREE.CylinderGeometry(canopyR*0.09, canopyR*0.13, trunkH, 6),
    mat('#4a3218', { roughness: 0.95 }),
    0, trunkH/2, 0
  );
  g.add(trunk);
  const blobs = style === 'tall' ? 3 : style === 'lush' ? 6 : 4;
  for (let i = 0; i < blobs; i++) {
    const a = (i / blobs) * Math.PI * 2;
    const r = canopyR * (0.62 + Math.random()*0.3);
    const bx = Math.cos(a) * canopyR * (style === 'lush' ? 0.4 : 0.32);
    const bz = Math.sin(a) * canopyR * (style === 'lush' ? 0.4 : 0.32);
    const by = trunkH + r * (style === 'tall' ? 0.9 : 0.55) + i*0.05;
    const geo = new THREE.IcosahedronGeometry(r, 0);
    const c = new THREE.Color(canopyColor).offsetHSL(0, 0, (Math.random()-0.5)*0.06);
    g.add(meshLite(geo, mat(c, { roughness: 0.9 }), bx, by, bz));
  }
  const topGeo = new THREE.IcosahedronGeometry(canopyR*0.7, 0);
  g.add(mesh(topGeo, mat(canopyColor, { roughness: 0.9 }), 0, trunkH + canopyR*(style==='tall'?1.3:0.85), 0));
  return g;
}

// higuera real: tronco bajo que se abre en 2-3 ramas cerca del piso y copa
// ancha y baja (la de campo está caída, así que las hojas casi tocan el piso)
function makeFig(canopyR, trunkH, canopyColor) {
  const g = new THREE.Group();
  const barkMat = mat('#5a4530', { roughness: 0.95 });
  g.add(mesh(new THREE.CylinderGeometry(canopyR*0.11, canopyR*0.17, trunkH, 6), barkMat, 0, trunkH/2, 0));
  for (let i = 0; i < 3; i++) {
    const a = (i/3)*Math.PI*2 + 0.4;
    const branch = mesh(new THREE.CylinderGeometry(canopyR*0.05, canopyR*0.09, trunkH*0.95, 6), barkMat);
    branch.position.set(Math.cos(a)*canopyR*0.14, trunkH*0.6, Math.sin(a)*canopyR*0.14);
    branch.rotation.z = Math.cos(a)*0.55;
    branch.rotation.x = Math.sin(a)*0.55;
    g.add(branch);
  }
  const blobs = 7;
  for (let i = 0; i < blobs; i++) {
    const a = (i/blobs)*Math.PI*2;
    const r = canopyR * (0.5 + Math.random()*0.28);
    const bx = Math.cos(a)*canopyR*0.44, bz = Math.sin(a)*canopyR*0.44;
    const by = trunkH*0.62 + r*0.5;
    const c = new THREE.Color(canopyColor).offsetHSL(0, 0, (Math.random()-0.5)*0.06);
    g.add(meshLite(new THREE.IcosahedronGeometry(r, 0), mat(c, { roughness: 0.9 }), bx, by, bz));
  }
  g.add(mesh(new THREE.IcosahedronGeometry(canopyR*0.72, 0), mat(canopyColor, { roughness: 0.9 }), 0, trunkH*0.62+canopyR*0.5, 0));
  return g;
}

// álamo real: columna angosta y alta de follaje apilado, casi sin copa ancha
function makePoplar(height, canopyR, canopyColor) {
  const g = new THREE.Group();
  const trunkH = height * 0.16;
  g.add(mesh(new THREE.CylinderGeometry(canopyR*0.16, canopyR*0.22, trunkH, 6), mat('#4a3a26',{roughness:0.95}), 0, trunkH/2, 0));
  const blobs = 6;
  for (let i = 0; i < blobs; i++) {
    const t = i/(blobs-1);
    const by = trunkH + t*(height-trunkH*1.1);
    const r = canopyR * (0.5 + 0.5*Math.sin(t*Math.PI));
    const bx = (Math.random()-0.5)*canopyR*0.22, bz = (Math.random()-0.5)*canopyR*0.22;
    const c = new THREE.Color(canopyColor || '#4d7a2a').offsetHSL(0, 0, (Math.random()-0.5)*0.05);
    g.add(meshLite(new THREE.IcosahedronGeometry(r, 0), mat(c, { roughness: 0.9 }), bx, by, bz));
  }
  return g;
}

// enredadera desprolija trepando un palo (columna de la galería)
function vineOnPost(radius, height, color) {
  const g = new THREE.Group();
  const leafMat = mat(color, { roughness: 0.9 });
  const n = 8;
  for (let i = 0; i < n; i++) {
    const t = i/n;
    const a = t*Math.PI*5;
    const y = 0.15 + t*height*0.85;
    const r = radius + 0.05;
    g.add(meshLite(new THREE.IcosahedronGeometry(0.045+Math.random()*0.04,0), leafMat, Math.cos(a)*r, y, Math.sin(a)*r));
  }
  // un par de brotes sueltos colgando, para que no quede prolijo
  const by = height*(0.45+Math.random()*0.3);
  for (let j = 0; j < 3; j++) {
    g.add(meshLite(new THREE.IcosahedronGeometry(0.038,0), leafMat, radius+0.1+Math.random()*0.06, by-j*0.11, (Math.random()-0.5)*0.15));
  }
  return g;
}

// cantero desprolijo con flores mixtas y alguna enredadera escapándose por el piso
function flowerBed(length) {
  const g = new THREE.Group();
  g.add(mesh(new THREE.BoxGeometry(length, 0.22, 0.5), mat('#4a3a28',{roughness:1}), 0, 0.11, 0));
  const flowerColors = ['#e8a0c0','#f0d060','#eeeee2','#c86048'];
  const n = Math.round(length*2);
  for (let i = 0; i < n; i++) {
    const fx = -length/2 + Math.random()*length, fz = (Math.random()-0.5)*0.4;
    const isLeaf = Math.random() > 0.45;
    const col = isLeaf ? '#4a6a2a' : flowerColors[Math.floor(Math.random()*flowerColors.length)];
    g.add(meshLite(new THREE.IcosahedronGeometry(0.06+Math.random()*0.08,0), mat(col,{roughness:0.85}), fx, 0.22+Math.random()*0.22, fz));
  }
  const vineMat = mat('#3f6a1e', { roughness: 0.9 });
  for (let k = 0; k < 2; k++) {
    const vx = -length/2 + Math.random()*length;
    for (let j = 0; j < 4; j++) {
      g.add(meshLite(new THREE.IcosahedronGeometry(0.035,0), vineMat, vx+(Math.random()-0.5)*0.5, 0.05, 0.3+j*0.18+Math.random()*0.1));
    }
  }
  return g;
}

// arbusto bajo, más ancho que alto, denso — para el jardín cerca de la casa
function makeShrub(canopyR, color) {
  const g = new THREE.Group();
  const blobs = 5;
  for (let i = 0; i < blobs; i++) {
    const a = (i/blobs)*Math.PI*2;
    const r = canopyR * (0.55 + Math.random()*0.3);
    const c = new THREE.Color(color).offsetHSL(0, 0, (Math.random()-0.5)*0.06);
    g.add(meshLite(new THREE.IcosahedronGeometry(r,0), mat(c,{roughness:0.92}), Math.cos(a)*canopyR*0.42, r*0.6, Math.sin(a)*canopyR*0.42));
  }
  g.add(mesh(new THREE.IcosahedronGeometry(canopyR*0.62,0), mat(color,{roughness:0.92}), 0, canopyR*0.55, 0));
  return g;
}

function makePerson() {
  const g = new THREE.Group();
  const body = mesh(new THREE.CylinderGeometry(0.09,0.12,0.55,6), mat('#141414',{roughness:1}), 0,0.30,0);
  const head = mesh(new THREE.SphereGeometry(0.09,8,6), mat('#1c1c1c',{roughness:1}), 0,0.66,0);
  g.add(body, head);
  return g;
}

function fenceRun(x1,z1,x2,z2,spacing) {
  const g = new THREE.Group();
  const dx = x2-x1, dz = z2-z1;
  const len = Math.hypot(dx,dz);
  const n = Math.max(1, Math.round(len/spacing));
  const postMat = mat('#4a3a24', { roughness: 0.95 });
  const wireMat = new THREE.LineBasicMaterial({ color: 0x555555, transparent:true, opacity:0.55 });
  const pts = [];
  for (let i=0;i<=n;i++) {
    const t = i/n;
    const px = x1+dx*t, pz = z1+dz*t;
    g.add(mesh(new THREE.CylinderGeometry(0.045,0.06,0.85,5), postMat, px,0.42,pz));
    pts.push(new THREE.Vector3(px,0.72,pz));
  }
  g.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), wireMat));
  return g;
}

   STATIC SCENE — plinth, terrain, landscape

scene.add(staticGroup);

(function buildPlinth() {
  const M = 4, PH = 1.1;
  const geo = new THREE.BoxGeometry(FW + 2*M, PH, FH + 2*M);
  const top = mat('#c9a877', { map: woodTopTex, roughness: 0.55 });
  const side = mat('#b89468', { map: woodSideTex, roughness: 0.6 });
  const mats = [side, side, top, side, side, side];
  const plinth = new THREE.Mesh(geo, mats);
  plinth.position.y = -PH/2;
  plinth.receiveShadow = true; plinth.castShadow = true;
  staticGroup.add(plinth);

  const grass = mesh(
    new THREE.PlaneGeometry(FW, FH),
    mat('#4a6a24', { map: grassTex, roughness: 0.92 })
  );
  grass.rotation.x = -Math.PI/2;
  grass.position.y = 0.012;
  grass.receiveShadow = true;
  staticGroup.add(grass);
})();

function label3D(text, x, y, z, cls) {
  const div = document.createElement('div');
  div.className = cls || 'lbl-static';
  div.textContent = text;
  labelLayer.appendChild(div);
  staticLabels.push({ el: div, pos: new THREE.Vector3(x,y,z) });
}

// ── CASA · estilo estancia: paredes terracota, techo chapa. La galería larga
//    (con la ventana grande) va sobre la pared este, mirando al lote grande;
//    el lado oeste (hacia la entrada/álamos) es el costado corto con la
//    chimenea y las 2 ventanas. Ridge del techo corre en Z (eje largo) ──
(function buildCasa() {
  const w = 10, d = 15, wallH = 3.0, roofH = 1.9;
  const porchDepth = 2.4;
  const cx = toWX(6.5+w/2), cz = toWZ(27+d/2);
  const g = new THREE.Group(); g.position.set(cx, 0, cz);

  const wallMat = mat('#7a2a20', { roughness: 0.85 });
  const trimMat = mat('#f0ead8', { roughness: 0.7 });
  const wall = mesh(new THREE.BoxGeometry(w, wallH, d), wallMat, 0, wallH/2, 0);
  g.add(wall);
  // zócalo claro
  g.add(mesh(new THREE.BoxGeometry(w+0.06, 0.3, d+0.06), trimMat, 0, 0.15, 0));

  const roofMat = mat('#8f9088', { roughness: 0.5, metalness: 0.35 });
  const slopeLen = Math.hypot(w/2, roofH);

  // paño oeste (corto, sin galería): cae hacia la pared con la chimenea
  const slopeW = mesh(new THREE.BoxGeometry(slopeLen, 0.12, d+0.6), roofMat);
  slopeW.position.set(-w/4, wallH + roofH/2, 0);
  slopeW.rotation.z = Math.atan2(roofH, w/2);
  g.add(slopeW);

  // paño este extendido: cubre la galería que mira al lote grande
  const eAngle = Math.atan2(roofH*0.72, w/2 + porchDepth);
  const slopeE = mesh(new THREE.BoxGeometry(slopeLen + porchDepth*1.35, 0.12, d+0.6), roofMat);
  slopeE.position.set(w/4 + porchDepth*0.55, wallH + (roofH*0.72)/2, 0);
  slopeE.rotation.z = -eAngle;
  g.add(slopeE);

  // chimenea, sobre la pared corta sur (la que se ve al lado de la galería,
  // mismo terracota + remate oscuro de chapa)
  g.add(mesh(new THREE.BoxGeometry(0.7,1.1,0.7), mat('#7a2a20',{roughness:0.9}), -w*0.28, wallH+roofH*0.6, -d/2+0.5));
  g.add(mesh(new THREE.BoxGeometry(0.82,0.1,0.82), mat('#2a2825',{roughness:0.6,metalness:0.3}), -w*0.28, wallH+roofH*0.6+0.6, -d/2+0.5));

  // galería: piso + columnas, del lado este, mirando al lote grande
  const porchFloor = mesh(new THREE.BoxGeometry(porchDepth, 0.12, d-0.4), mat('#9a9488',{roughness:0.85}), w/2 + porchDepth/2, 0.06, 0);
  g.add(porchFloor);
  const colMat = mat('#2a2825', { roughness: 0.6, metalness: 0.2 });
  const colX = w/2 + porchDepth - 0.15;
  for (const cz2 of [-d/2+1.2, -d/6, d/6, d/2-1.2]) {
    g.add(mesh(new THREE.CylinderGeometry(0.09,0.09,wallH*0.92,8), colMat, colX, wallH*0.46, cz2));
    // enredadera desprolija trepando el palo de la galería
    const vine = vineOnPost(0.09, wallH*0.92, '#3f6a1e');
    vine.position.set(colX, 0, cz2);
    g.add(vine);
  }

  // ventana grande de la galería (una sola, corrida a lo largo de la pared este):
  // vidrio oscuro con marco claro, para que se lea de día y no solo brille de noche
  const frameMat = mat('#f0ead8', { roughness: 0.6 });
  const winMat = new THREE.MeshStandardMaterial({ color:'#232a30', emissive:'#ffb95c', emissiveIntensity:0, roughness:0.25, metalness:0.15 });
  g.add(mesh(new THREE.BoxGeometry(0.08, 1.92, d-2.85), frameMat, w/2+0.015, 1.6, 0));
  const bigWin = mesh(new THREE.PlaneGeometry(d-3, 1.8), winMat, w/2+0.05, 1.6, 0);
  bigWin.rotation.y = Math.PI/2;
  g.add(bigWin);
  scene.__casaWinMat = winMat;

  // 2 ventanas nomás, en la pared corta lisa (la que se ve al lado de la
  // galería), después de la chimenea
  const winMat2 = new THREE.MeshStandardMaterial({ color:'#232a30', emissive:'#ffb95c', emissiveIntensity:0, roughness:0.25, metalness:0.15 });
  const winGeo = new THREE.PlaneGeometry(1.3, 1.5);
  for (const wx of [-0.6, 1.9]) {
    g.add(mesh(new THREE.BoxGeometry(1.42, 1.62, 0.08), frameMat, wx, 1.6, -d/2-0.015));
    const win = mesh(winGeo, winMat2, wx, 1.6, -d/2-0.05);
    win.rotation.y = Math.PI;
    g.add(win);
  }
  scene.__casaWinMat2 = winMat2;

  // cantero desprolijo con flores y enredaderas, al pie de las ventanas
  const bed = flowerBed(4.2);
  bed.position.set(0.6, 0, -d/2-0.35);
  g.add(bed);

  staticGroup.add(g);
  label3D('CASA', cx, wallH+roofH+0.6, cz);
})();

// tranquera genérica (portón de madera), reutilizable en cualquier punto del cerco
function buildTranquera(halfW, postH) {
  const g = new THREE.Group();
  const woodMat = mat('#6a4a28', { roughness: 0.9 });
  const postMat = mat('#5a3e22', { roughness: 0.9 });
  g.add(mesh(new THREE.CylinderGeometry(0.11,0.13,postH+0.3,8), postMat, -halfW,(postH+0.3)/2,0));
  g.add(mesh(new THREE.CylinderGeometry(0.11,0.13,postH+0.3,8), postMat,  halfW,(postH+0.3)/2,0));
  for (const py of [postH*0.26, postH*0.55, postH*0.85]) {
    g.add(mesh(new THREE.BoxGeometry(halfW*2-0.15, 0.08, 0.06), woodMat, 0, py, 0));
  }
  const diag = mesh(new THREE.BoxGeometry(Math.hypot(halfW*2-0.2,postH*0.62), 0.07, 0.05), woodMat, 0, postH*0.55, 0);
  diag.rotation.z = Math.atan2(postH*0.62, halfW*2-0.2);
  g.add(diag);
  return g;
}

function buildWaterTower(height, tankR) {
  const g = new THREE.Group();
  const legMatT = mat('#4a3a28', { roughness: 0.9 });
  const r = tankR*0.85;
  for (const [lx,lz] of [[r,r],[-r,r],[r,-r],[-r,-r]]) {
    g.add(mesh(new THREE.CylinderGeometry(0.06,0.07,height,6), legMatT, lx, height/2, lz));
    const vine = vineOnPost(0.07, height*0.8, '#3f6a1e');
    vine.position.set(lx, 0, lz);
    g.add(vine);
  }
  for (const hy of [height*0.35, height*0.7]) {
    for (const sign of [1,-1]) {
      const cross = mesh(new THREE.BoxGeometry(Math.hypot(r*2,r*2),0.04,0.04), legMatT, 0, hy, 0);
      cross.rotation.y = sign*Math.PI/4;
      g.add(cross);
    }
  }
  g.add(mesh(new THREE.CylinderGeometry(r*0.95,r*0.95,0.08,12), legMatT, 0, height, 0));
  g.add(mesh(new THREE.CylinderGeometry(tankR,tankR,tankR*1.1,14), mat('#8a8478',{roughness:0.6,metalness:0.3}), 0, height+tankR*0.65, 0));
  g.add(mesh(new THREE.ConeGeometry(tankR*1.05,tankR*0.4,14), mat('#6a645a',{roughness:0.6}), 0, height+tankR*1.3, 0));
  return g;
}

   ITEM BUILDERS

function chairsAround(w, h, count, seatMat) {
  const g = new THREE.Group();
  const rx = w/2 + 0.28, rz = h/2 + 0.28;
  for (let i = 0; i < count; i++) {
    const a = (i/count) * Math.PI*2;
    const cx = Math.cos(a) * rx, cz = Math.sin(a) * rz;
    const seat = mesh(new THREE.BoxGeometry(0.34,0.06,0.34), seatMat, cx, 0.42, cz);
    const back = mesh(new THREE.BoxGeometry(0.34,0.34,0.04), seatMat, cx*1.02, 0.6, cz*1.02);
    back.lookAt(0, 0.6, 0);
    const leg = mesh(new THREE.CylinderGeometry(0.02,0.02,0.42,5), seatMat, cx, 0.21, cz);
    g.add(seat, back, leg);
  }
  return g;
}

function pampasGrass(scale) {
  scale = scale || 1;
  const g = new THREE.Group();
  const bladeMat = mat('#5a7a2c', { roughness: 0.95 });
  const plumeMat = mat('#e8dcc0', { roughness: 0.9 });
  const n = 7;
  for (let i=0;i<n;i++) {
    const a = (i/n)*Math.PI*2 + Math.random()*0.4;
    const h1 = (0.55+Math.random()*0.35)*scale;
    const blade = mesh(new THREE.ConeGeometry(0.03*scale, h1, 4), bladeMat, Math.cos(a)*0.08*scale, h1/2, Math.sin(a)*0.08*scale);
    blade.rotation.z = Math.cos(a)*0.35; blade.rotation.x = -Math.sin(a)*0.35;
    g.add(blade);
    if (i % 2 === 0) {
      const plume = mesh(new THREE.ConeGeometry(0.05*scale, 0.22*scale, 5), plumeMat, blade.position.x, h1+0.08*scale, blade.position.z);
      plume.rotation.copy(blade.rotation);
      g.add(plume);
    }
  }
  return g;
}

// fardo rectangular (paja) vestido con tela clara cruzada y atada con cuerda,
// como en el moodboard: no es el rollo redondo, es el bloque cuadrado/rectangular
// con una telita encima para sentarse.
function hayBale(halfSize, length, color) {
  const g = new THREE.Group();
  const width = halfSize * 1.7, height = halfSize * 1.35;
  const straw = mesh(new THREE.BoxGeometry(length, height, width), mat(color, { roughness: 1 }), 0, height/2, 0);
  g.add(straw);
  // hilo/alambre que envuelve el fardo, dos vueltas (finas)
  const twineMat = mat('#4a3f2e', { roughness: 0.9 });
  for (const off of [-length*0.3, length*0.3]) {
    g.add(mesh(new THREE.BoxGeometry(0.025, height+0.015, width+0.015), twineMat, off, height/2, 0));
  }
  // tela clara cruzada solo por arriba, cuelga apenas de los costados: se ve la paja abajo
  const clothMat = mat('#ddcea0', { roughness: 0.88 });
  g.add(mesh(new THREE.BoxGeometry(length*0.78, 0.03, width+0.16), clothMat, 0, height+0.015, 0));
  return g;
}

// living Gervasoni: sillón blanco/perla bajo, con almohadón grueso y respaldo
// bajo curvo, sobre marco de aluminio claro (línea InOut) — de "ancho"
// variable para armar sillones simples (~0.75m) o dobles (~1.3m).
function gervasoniSeat(width) {
  const g = new THREE.Group();
  const depth = 0.82, seatH = 0.36;
  const frameMat = mat('#cdc8b6', { roughness: 0.45, metalness: 0.2 });
  const cushionMat = mat('#ece8dd', { roughness: 0.6 });
  g.add(mesh(new THREE.BoxGeometry(width, 0.06, depth), frameMat, 0, 0.3, 0));
  g.add(mesh(new THREE.BoxGeometry(width-0.05, 0.2, depth-0.06), cushionMat, 0, seatH, 0.01));
  g.add(mesh(new THREE.BoxGeometry(width-0.05, 0.3, 0.14), cushionMat, 0, seatH+0.16, -depth/2+0.08));
  for (const lx of [-width/2+0.07, width/2-0.07]) for (const lz of [-depth/2+0.07, depth/2-0.07]) {
    g.add(mesh(new THREE.CylinderGeometry(0.018,0.018,0.3,6), frameMat, lx, 0.15, lz));
  }
  return g;
}

function gervasoniTable(size) {
  const g = new THREE.Group();
  g.add(mesh(new THREE.CylinderGeometry(size/2, size/2, 0.04, 24), mat('#efece0',{roughness:0.4}), 0, 0.34, 0));
  g.add(mesh(new THREE.CylinderGeometry(0.025,0.025,0.32,8), mat('#cdc8b6',{roughness:0.5,metalness:0.2}), 0, 0.18, 0));
  g.add(mesh(new THREE.CylinderGeometry(size*0.42,size*0.42,0.02,24), mat('#cdc8b6',{roughness:0.5,metalness:0.2}), 0, 0.02, 0));
  return g;
}

// arma un living Gervasoni completo: 2 sillones dobles + 4 simples alrededor
// de una mesa baja, todo blanco/perla — mismo mueble real para 'living' y
// 'livingf' (las dos entradas de "living" del panel).
function gervasoniLiving(w, h) {
  const g = new THREE.Group();
  const seq = [1.3, 0.75, 0.75, 1.3, 0.75, 0.75];
  const rx = Math.max(w/2*0.7, 1.3), rz = Math.max(h/2*0.7, 1.3);
  for (let i = 0; i < seq.length; i++) {
    const a = (i/seq.length) * Math.PI*2;
    const seat = gervasoniSeat(seq[i]);
    const px = Math.cos(a)*rx, pz = Math.sin(a)*rz;
    seat.position.set(px, 0, pz);
    seat.lookAt(0, 0, 0);
    seat.rotation.y += Math.PI;
    g.add(seat);
  }
  g.add(gervasoniTable(Math.min(w,h)*0.34));
  return g;
}

function buildItemMesh(item) {
  const cfg = TYPES[item.type] || TYPES.otro;
  const g = new THREE.Group();
  const w = item.w, h = item.h;
  const legMat = mat('#2a2018', { roughness: 0.9 });
  const bodyMat = mat(cfg.color, { roughness: 0.75 });

  switch (item.type) {
    case 'mesa': {
      const r = w/2;
      g.add(mesh(new THREE.CylinderGeometry(r, r, 0.06, 28), bodyMat, 0, 0.78, 0));
      g.add(mesh(new THREE.CylinderGeometry(0.07,0.09,0.75,10), legMat, 0, 0.39, 0));
      g.add(chairsAround(w, w, Math.max(4, Math.round(w*2)), mat('#3a3028',{roughness:0.9})));
      break;
    }
    case 'mesaimp': {
      g.add(mesh(new THREE.BoxGeometry(w, 0.07, h), mat('#e8e4d8',{roughness:0.6}), 0, 0.78, 0));
      for (const sx of [-w/2+0.15, w/2-0.15]) for (const sz of [-h/2+0.15, h/2-0.15]) {
        g.add(mesh(new THREE.CylinderGeometry(0.05,0.05,0.75,6), legMat, sx, 0.39, sz));
      }
      g.add(chairsAround(w-0.6, h+0.7, 8, mat('#3a3028',{roughness:0.9})));
      break;
    }
    case 'pista': {
      const floor = mesh(new THREE.BoxGeometry(w, 0.1, h), mat('#3a2c1e', { map: danceTileTex, roughness: 0.35, metalness: 0.1 }), 0, 0.05, 0);
      g.add(floor);
      if (item.lightsOn) {
        const glow = mesh(new THREE.BoxGeometry(w-0.1,0.02,h-0.1), new THREE.MeshStandardMaterial({ color:'#3a2c1e', emissive:'#ffb050', emissiveIntensity:0 }), 0, 0.11, 0);
        registerFlicker(glow.material, 0.55, 3.2);
        g.add(glow);
        const pl = addNightLight(new THREE.PointLight(0xffc888, 0, Math.max(w,h)*1.4, 2), 1.3);
        pl.position.set(0, 2.4, 0);
        g.userData.lights = [pl];
      }
      break;
    }
    case 'barra': case 'barrafardos': {
      const counter = mesh(new THREE.BoxGeometry(w, 1.05, h), bodyMat, 0, 0.52, 0);
      g.add(counter);
      g.add(mesh(new THREE.BoxGeometry(w+0.06,0.06,h+0.06), mat('#3a2c1a',{roughness:0.5}), 0, 1.06, 0));
      for (let i = 0; i < Math.max(2, Math.round(w)); i++) {
        const bx = -w/2 + 0.3 + i*(w-0.6)/Math.max(1,Math.round(w)-1);
        g.add(mesh(new THREE.CylinderGeometry(0.035,0.045,0.28,6), mat('#2a5a3a',{roughness:0.3,metalness:0.2}), bx, 1.24, 0));
      }
      break;
    }
    case 'comida': {
      for (let i=0;i<3;i++) {
        const tw = Math.min(w, 1.3), th = h*0.8;
        g.add(mesh(new THREE.BoxGeometry(tw, 0.05, th), mat('#e8e0cc',{roughness:0.6}), -w/2+tw/2+i*(w/3), 0.85, 0));
        g.add(mesh(new THREE.CylinderGeometry(0.04,0.04,0.85,6), legMat, -w/2+tw/2+i*(w/3), 0.42, th/2-0.1));
        g.add(mesh(new THREE.CylinderGeometry(0.04,0.04,0.85,6), legMat, -w/2+tw/2+i*(w/3), 0.42, -th/2+0.1));
      }
      break;
    }
    case 'cuina': {
      // catering al aire libre, sin techo: mostrador largo con mantel oscuro,
      // rack rústico con lucecitas cálidas, islas de apoyo, un fueguito,
      // matas desprolijas con algún fruto rojo y carteles de menú de pie
      const counterMat = mat('#1c1c1c', { roughness: 0.75 });
      const topMat = mat('#242220', { roughness: 0.6 });
      const woodMat = mat('#5a4028', { roughness: 0.9 });
      const legMat2 = mat('#141414', { roughness: 0.85 });
      const depth = Math.min(h, 0.9);

      g.add(mesh(new THREE.BoxGeometry(w, 0.85, depth), counterMat, 0, 0.42, -h/2+depth/2));
      g.add(mesh(new THREE.BoxGeometry(w+0.06, 0.05, depth+0.06), topMat, 0, 0.85, -h/2+depth/2));

      const rackZ = -h/2 - 0.15, rackH = 1.7;
      for (const rx of [-w/2+0.3, w/2-0.3]) {
        g.add(mesh(new THREE.CylinderGeometry(0.04,0.05,rackH,6), woodMat, rx, rackH/2, rackZ));
      }
      const beam = mesh(new THREE.CylinderGeometry(0.03,0.03,w-0.4,6), woodMat, 0, rackH, rackZ);
      beam.rotation.z = Math.PI/2;
      g.add(beam);
      const nBulbs = Math.max(4, Math.round(w/0.8));
      for (let i=0;i<=nBulbs;i++) {
        const bx = -w/2+0.3 + (w-0.6)*i/nBulbs;
        const bMat = new THREE.MeshStandardMaterial({ color:'#2a2010', emissive:'#ffc878', emissiveIntensity:0 });
        registerFlicker(bMat, 0.85, 4+(i%3));
        g.add(mesh(new THREE.SphereGeometry(0.045,6,6), bMat, bx, rackH-0.15, rackZ));
      }

      for (const ix of [-w*0.28, w*0.22]) {
        g.add(mesh(new THREE.BoxGeometry(0.9,0.72,0.6), counterMat, ix, 0.36, h*0.18));
        g.add(mesh(new THREE.BoxGeometry(0.95,0.04,0.65), topMat, ix, 0.73, h*0.18));
      }

      const flameMat = new THREE.MeshStandardMaterial({ color:'#ff6018', emissive:'#ff8028', emissiveIntensity:1.3 });
      registerFlicker(flameMat, 1.3, 9);
      g.add(mesh(new THREE.ConeGeometry(0.14,0.34,7), flameMat, w/2-0.4, 0.62, h*0.15));
      const cookPl = addNightLight(new THREE.PointLight(0xff7020, 0, 3, 2), 1.1);
      cookPl.position.set(w/2-0.4, 0.7, h*0.15);
      cookPl.userData.alwaysOn = true;

      for (const sx of [-w/2+0.35, w/2-0.35]) {
        const bush = makeShrub(0.5, '#4a6a24');
        bush.position.set(sx, 0, h/2-0.1);
        g.add(bush);
        for (let k=0;k<4;k++) {
          g.add(meshLite(new THREE.SphereGeometry(0.03,5,5), mat('#b02818',{roughness:0.5}), sx+(Math.random()-0.5)*0.4, 0.35+Math.random()*0.3, h/2-0.1+(Math.random()-0.5)*0.3));
        }
      }

      for (const sx2 of [w*0.02, w*0.02+0.5]) {
        g.add(mesh(new THREE.CylinderGeometry(0.015,0.015,1.1,6), legMat2, sx2, 0.55, h/2+0.35));
        g.add(mesh(new THREE.BoxGeometry(0.28,0.4,0.02), mat('#181818',{roughness:0.5}), sx2, 1.05, h/2+0.35));
      }
      g.userData.lights = [cookPl];
      break;
    }
    case 'deco': {
      const arch = mesh(new THREE.TorusGeometry(Math.min(w,h)/2, 0.06, 8, 16, Math.PI), mat(cfg.color,{roughness:0.6}));
      arch.rotation.z = Math.PI; arch.position.y = Math.min(w,h)/2;
      g.add(arch);
      for (let i=0;i<8;i++) {
        const a = Math.random()*Math.PI*2, r = Math.random()*Math.min(w,h)/2;
        g.add(mesh(new THREE.SphereGeometry(0.08,6,6), mat(['#e8a0c8','#f0d060','#ffffff'][i%3],{roughness:0.4}), Math.cos(a)*r, 0.5+Math.random()*1.2, Math.sin(a)*r));
      }
      break;
    }
    case 'bombita': {
      const poleH = 2.6;
      g.add(mesh(new THREE.CylinderGeometry(0.05,0.06,poleH,6), legMat, -w/2,poleH/2,0));
      g.add(mesh(new THREE.CylinderGeometry(0.05,0.06,poleH,6), legMat,  w/2,poleH/2,0));
      const n = Math.max(4, Math.round(w/0.55));
      for (let i=0;i<=n;i++) {
        const bx = -w/2 + (w*i/n);
        const by = poleH - Math.sin((i/n)*Math.PI)*0.35;
        const bulbMat = new THREE.MeshStandardMaterial({ color:'#3a3010', emissive:'#ffd060', emissiveIntensity:0 });
        registerFlicker(bulbMat, 1, 4 + (i%3));
        g.add(mesh(new THREE.SphereGeometry(0.05,6,6), bulbMat, bx, by, 0));
      }
      break;
    }
    case 'bebedero': {
      // caño/bebedero de campo oxidado, con latas de cerveza arriba
      const r = Math.min(0.22, h/2);
      const rustMat = mat('#8a6a52', { roughness: 0.95, metalness: 0.15 });
      const pipe = mesh(new THREE.CylinderGeometry(r, r, w, 16), rustMat, 0, r+0.3, 0);
      pipe.rotation.z = Math.PI/2;
      g.add(pipe);
      const legMat2 = mat('#4a4238', { roughness: 0.9 });
      for (const lx of [-w/2+0.25, w/2-0.25]) {
        g.add(mesh(new THREE.CylinderGeometry(0.03,0.03,0.34,6), legMat2, lx,0.17,-r*0.7).rotateZ(0.2));
        g.add(mesh(new THREE.CylinderGeometry(0.03,0.03,0.34,6), legMat2, lx,0.17, r*0.7).rotateZ(-0.2));
      }
      const canMat = mat('#c8ccd0', { metalness: 0.75, roughness: 0.25 });
      for (let i=0;i<Math.max(4,Math.round(w*1.8));i++) {
        const cx3 = -w/2+0.3 + Math.random()*(w-0.6);
        g.add(mesh(new THREE.CylinderGeometry(0.045,0.045,0.24,8), canMat, cx3, r*2+0.3-0.02, (Math.random()-0.5)*r*0.6));
      }
      break;
    }
    case 'reflector': {
      for (const a of [0, 2.1, 4.2]) {
        const leg = mesh(new THREE.CylinderGeometry(0.02,0.02,0.9,5), legMat);
        leg.position.set(Math.cos(a)*0.18, 0.45, Math.sin(a)*0.18);
        leg.rotation.z = Math.cos(a)*0.35; leg.rotation.x = Math.sin(a)*0.35;
        g.add(leg);
      }
      const headMat = new THREE.MeshStandardMaterial({ color:'#e8e0a0', emissive:'#fff8d0', emissiveIntensity:0, roughness:0.3 });
      registerFlicker(headMat, 0.9, 6);
      g.add(mesh(new THREE.CylinderGeometry(0.11,0.14,0.22,10), headMat, 0, 1.0, 0));
      const beamMat = new THREE.MeshBasicMaterial({ color:'#fff8d0', transparent:true, opacity:0 });
      const beam = mesh(new THREE.ConeGeometry(0.9, 3, 12, 1, true), beamMat, 0, 2.6, 0);
      registerFlicker(beamMat, 0.10, 6, 'opacity');
      g.add(beam);
      const sp = addNightLight(new THREE.SpotLight(0xfff2c8, 0, 12, Math.PI/6, 0.5, 1.4), 2.2);
      sp.position.set(0,1.1,0); sp.target.position.set(0,0,0); g.add(sp.target);
      g.userData.lights = [sp];

    }
    case 'vela': {
      // camino de velitas: fardito chico que sostiene un vidrio con la vela adentro
      const baseHalf = 0.16, baseLen = 0.26;
      g.add(hayBale(baseHalf, baseLen, TYPES.fardo.color));
      const baseH = baseHalf * 1.35;
      const glassMat = mat('#dfeee8', { roughness: 0.55, transparent: true, opacity: 0.38 });
      g.add(mesh(new THREE.CylinderGeometry(0.08,0.09,0.2,10,1,true), glassMat, 0, baseH+0.1, 0));
      g.add(mesh(new THREE.CylinderGeometry(0.038,0.042,0.13,8), mat('#e8d8b0',{roughness:0.6}), 0, baseH+0.065, 0));
      const flameMat = new THREE.MeshStandardMaterial({ color:'#ff8010', emissive:'#ff9020', emissiveIntensity:1 });
      registerFlicker(flameMat, 1, 8);
      g.add(mesh(new THREE.SphereGeometry(0.032,6,6), flameMat, 0, baseH+0.15, 0));
      const pl = addNightLight(new THREE.PointLight(0xff9020, 0, 2.2, 2), 0.7);
      pl.position.set(0, baseH+0.18, 0);
      g.userData.lights = [pl];
      break;
    }
    case 'livingf':
    case 'living': {
      // living Gervasoni real: 2 sillones dobles + 4 simples blancos + mesa
      g.add(gervasoniLiving(w, h));
      break;
    }
    case 'sanitario': {
      const wallH = 2.3;
      g.add(mesh(new THREE.BoxGeometry(w,wallH,h), mat('#d4c8a8',{roughness:0.75}), 0, wallH/2, 0));
      const roof = mesh(new THREE.BoxGeometry(w+0.4,0.12,h+0.4), mat('#6a6258',{roughness:0.5}), 0, wallH+0.06, 0);
      g.add(roof);
      const doorMat = new THREE.MeshStandardMaterial({ color:'#4a3c28', emissive:'#ffb95c', emissiveIntensity:0, roughness:0.6 });
      registerFlicker(doorMat, 0.5, 0.001);
      for (let i=0;i<5;i++) {
        const dx = -w/2 + 0.5 + i*(w-1)/4;
        g.add(mesh(new THREE.BoxGeometry(0.55,1.5,0.04), doorMat, dx, 0.75, h/2+0.03));

    }
    case 'tractor': {
      g.add(mesh(new THREE.BoxGeometry(w*0.55,0.6,h), mat('#c0392b',{roughness:0.55}), -w*0.12,0.55,0));
      g.add(mesh(new THREE.BoxGeometry(w*0.32,0.55,h*0.7), mat('#e8e0d0',{roughness:0.4,transparent:true,opacity:0.5}), w*0.22,0.85,0));
      const wheelMat = mat('#181818',{roughness:0.95});
      g.add(mesh(new THREE.CylinderGeometry(0.42,0.42,0.3,14), wheelMat, -w*0.22,0.42,h/2-0.02).rotateOnAxis(new THREE.Vector3(0,0,1),Math.PI/2));
      g.add(mesh(new THREE.CylinderGeometry(0.42,0.42,0.3,14), wheelMat, -w*0.22,0.42,-h/2+0.02).rotateOnAxis(new THREE.Vector3(0,0,1),Math.PI/2));
      g.add(mesh(new THREE.CylinderGeometry(0.22,0.22,0.24,12), wheelMat, w*0.32,0.22,h/2-0.05).rotateOnAxis(new THREE.Vector3(0,0,1),Math.PI/2));
      g.add(mesh(new THREE.CylinderGeometry(0.22,0.22,0.24,12), wheelMat, w*0.32,0.22,-h/2+0.05).rotateOnAxis(new THREE.Vector3(0,0,1),Math.PI/2));
      g.add(mesh(new THREE.CylinderGeometry(0.03,0.03,0.5,6), mat('#333',{metalness:0.6,roughness:0.4}), -w*0.05,1.15,h*0.15));
      break;
    }
    case 'dj': {
      g.add(mesh(new THREE.BoxGeometry(w,0.4,h), bodyMat, 0,0.2,0));
      g.add(mesh(new THREE.BoxGeometry(w*0.9,0.9,0.1), mat('#241a38',{roughness:0.6}), 0,0.85,-h/2+0.1));
      const boothMat = new THREE.MeshStandardMaterial({ color:'#241a38', emissive:'#a060ff', emissiveIntensity:0 });
      registerFlicker(boothMat, 0.7, 5);
      g.add(mesh(new THREE.BoxGeometry(w*0.9,0.12,0.05), boothMat, 0,1.0,-h/2+0.06));
      for (const sx of [-w*0.32, w*0.32]) {
        g.add(mesh(new THREE.BoxGeometry(0.35,0.9,0.35), mat('#111',{roughness:0.9}), sx,0.85,h/2-0.3));
      }
      const dj = addNightLight(new THREE.PointLight(0xa060ff, 0, 5, 2), 1.0);
      dj.position.set(0,1.5,0); g.userData.lights=[dj];
      break;
    }
    case 'trussdj': {
      // andamio/truss tipo arco de arco de fútbol, con cabezas móviles y pares de luz
      const poleH = 3.0;
      const trussMat = mat('#181818', { roughness: 0.55, metalness: 0.5 });
      for (const px of [-w/2, w/2]) {
        g.add(mesh(new THREE.BoxGeometry(0.12, poleH, 0.12), trussMat, px, poleH/2, 0));
        const brace = mesh(new THREE.BoxGeometry(0.03, poleH*1.05, 0.18), trussMat, px, poleH/2, 0);
        brace.rotation.y = Math.PI/4;
        g.add(brace);
      }
      g.add(mesh(new THREE.BoxGeometry(w+0.14, 0.16, 0.16), trussMat, 0, poleH, 0));
      const topBrace = mesh(new THREE.BoxGeometry(w, 0.03, 0.22), trussMat, 0, poleH-0.09, 0);
      topBrace.rotation.y = Math.PI/4;
      g.add(topBrace);

      const lightColors = ['#ff3050','#30a0ff','#ffe030','#30ff70'];
      const nHeads = Math.max(3, Math.round(w/0.9));
      const lights = [];
      for (let i = 0; i <= nHeads; i++) {
        const lx = -w/2 + (w*i/nHeads);
        const col = lightColors[i % lightColors.length];
        const headMat = new THREE.MeshStandardMaterial({ color:'#141414', emissive: col, emissiveIntensity: 0 });
        registerFlicker(headMat, 1.1, 5 + (i%3));
        const head = mesh(new THREE.CylinderGeometry(0.07,0.09,0.18,8), headMat, lx, poleH-0.2, 0);
        head.rotation.x = Math.PI*0.32;
        g.add(head);
        const beamMat = new THREE.MeshBasicMaterial({ color: col, transparent: true, opacity: 0 });
        registerFlicker(beamMat, 0.16, 5 + (i%3), 'opacity');
        const beam = mesh(new THREE.ConeGeometry(0.4, 2.1, 10, 1, true), beamMat, lx, poleH-1.35, 0.45);
        beam.rotation.x = Math.PI*0.12;
        g.add(beam);
        const pl = addNightLight(new THREE.PointLight(new THREE.Color(col), 0, 3.5, 2), 0.55);
        pl.position.set(lx, poleH-0.3, 0.2);
        lights.push(pl);
      }
      g.userData.lights = lights;
      break;
    }
    case 'fardo': {
      g.add(hayBale(Math.min(w,h)/2*0.85, Math.max(w,h), TYPES.fardo.color));
      break;
    }
    case 'fogonero': {
      // base de grava/piedra alrededor, aro de metal, leña cruzada, llama grande en capas
      const r = Math.max(w,h)/2;
      g.add(mesh(new THREE.CircleGeometry(r,24), mat('#9a8f78',{map:gravelTex,roughness:1}), 0,0.008,0).rotateX(-Math.PI/2));
      const ringMat = mat('#2a2622',{metalness:0.5,roughness:0.6});
      g.add(mesh(new THREE.TorusGeometry(r*0.62,0.05,8,24), ringMat, 0,0.14,0).rotateX(Math.PI/2));
      const logMat = mat('#7a5a34',{roughness:0.9});
      const logLen = r*1.1;
      for (const rot of [0.45, -0.45, 1.9, -1.9]) {
        g.add(mesh(new THREE.CylinderGeometry(0.055,0.065,logLen,7), logMat, 0,0.16+Math.random()*0.06,0).rotateZ(rot).rotateY(rot*1.3));
      }
      const flameCore = new THREE.MeshStandardMaterial({ color:'#ff5010', emissive:'#ff7018', emissiveIntensity:1.4 });
      const flameMid  = new THREE.MeshStandardMaterial({ color:'#ff8818', emissive:'#ffa838', emissiveIntensity:1.6 });
      const flameTip  = new THREE.MeshStandardMaterial({ color:'#ffd868', emissive:'#ffe888', emissiveIntensity:1.8 });
      registerFlicker(flameCore, 1.4, 8.5);
      registerFlicker(flameMid, 1.6, 10);
      registerFlicker(flameTip, 1.8, 12);
      g.add(mesh(new THREE.ConeGeometry(0.26,0.65,8), flameCore, 0,0.46,0));
      g.add(mesh(new THREE.ConeGeometry(0.17,0.55,8), flameMid, 0.02,0.62,-0.01));
      g.add(mesh(new THREE.ConeGeometry(0.09,0.4,7), flameTip, -0.01,0.82,0.02));
      const pl = addNightLight(new THREE.PointLight(0xff7020, 0, r*6, 2), 2.1);
      pl.position.set(0,0.7,0);
      pl.userData.alwaysOn = true;
      g.userData.lights=[pl];
      break;
    }
    case 'tronco': {
      const len = Math.max(w,h);
      const log = mesh(new THREE.CylinderGeometry(0.24,0.28,len,10), mat('#5a4028',{roughness:0.95}), 0,0.24,0);
      log.rotation.z = Math.PI/2;
      g.add(log);
      for (let i=0;i<3;i++) {
        const bx = -len/2 + 0.5 + i*len/3.2;
        g.add(mesh(new THREE.ConeGeometry(0.06,0.3,5), mat('#4a3220',{roughness:0.95}), bx, 0.4, (Math.random()-0.5)*0.3).rotateZ(0.9));
      }
      // matas de plumero (cortadera) prolijas alrededor del tronco caído
      for (const [px,pz,sc] of [[-len*0.32,0.55,1.1],[len*0.1,0.6,0.9],[len*0.38,-0.5,1.2]]) {
        const p = pampasGrass(sc);
        p.position.set(px, 0, pz);
        g.add(p);
      }
      break;
    }
    case 'rondafardos': {
      const r = w/2, n = 20;
      for (let i=0;i<n;i++) {
        const a = (i/n)*Math.PI*2;
        const b = hayBale(0.4, 0.85, TYPES.fardo.color);
        b.position.set(Math.cos(a)*r, 0, Math.sin(a)*r);
        b.rotation.y = a + Math.PI/2;
        g.add(b);
      }
      break;
    }
    case 'kermess': {
      const r = w/2, n = 10;
      const lights = [];
      for (let i=0;i<n;i++) {
        const a = (i/n)*Math.PI*2;
        const px = Math.cos(a)*r, pz = Math.sin(a)*r;
        g.add(mesh(new THREE.CylinderGeometry(0.04,0.05,1.7,6), legMat, px,0.85,pz));
        const bMat = new THREE.MeshStandardMaterial({ color:'#3a3010', emissive:'#ffd060', emissiveIntensity:0 });
        registerFlicker(bMat, 1, 3+(i%4));
        g.add(mesh(new THREE.SphereGeometry(0.08,8,8), bMat, px,1.75,pz));
      }
      break;
    }
    case 'texto': {
      g.add(mesh(new THREE.CylinderGeometry(0.03,0.03,0.9,6), mat('#1a1a1a',{roughness:0.6}), 0,0.45,0));
      g.add(mesh(new THREE.SphereGeometry(0.07,8,8), mat('#e0c078',{roughness:0.4}), 0,0.9,0));
      break;
    }
    default: {
      g.add(mesh(new THREE.BoxGeometry(w,0.6,h), bodyMat, 0,0.3,0));
    }
  }

  if (item.id === S.selId) {
    const ring = mesh(new THREE.RingGeometry(Math.max(w,h)/2+0.15, Math.max(w,h)/2+0.24, 32),
      new THREE.MeshBasicMaterial({ color:'#e0c078', side: THREE.DoubleSide, transparent:true, opacity:0.85 }));
    ring.rotation.x = -Math.PI/2; ring.position.y = 0.02;
    g.add(ring);
  }

  g.traverse(o => { o.userData.itemId = item.id; });
  return g;
}

/* ════════════════════════════════════════════════════════════
   ITEM RENDERING / DIFFING
   ════════════════════════════════════════════════════════════ */
const itemsLayer = new THREE.Group();
scene.add(itemsLayer);
const itemCache = new Map(); // id -> { node, key, x, z, rot }

function itemKey(item, sel) {
  return `${item.type}|${item.w}|${item.h}|${item.rot}|${sel?1:0}|${item.label}|${item.lightsOn?1:0}`;
}

function render() {
  const seen = new Set();
  for (const item of S.items) {
    seen.add(item.id);
    const sel = item.id === S.selId;
    const key = itemKey(item, sel);
    const cache = itemCache.get(item.id);
    const wx = toWX(item.x + item.w/2), wz = toWZ(item.y + item.h/2);
    const rotY = -item.rot * Math.PI/180;

    if (!cache || cache.key !== key) {
      if (cache) { itemsLayer.remove(cache.node); disposeGroup(cache.node); }
      const node = buildItemMesh(item);
      node.position.set(wx, 0, wz);
      node.rotation.y = rotY;
      itemsLayer.add(node);
      itemCache.set(item.id, { node, key, x: wx, z: wz, rot: rotY });
    } else if (cache.x !== wx || cache.z !== wz || cache.rot !== rotY) {
      cache.node.position.set(wx, 0, wz);
      cache.node.rotation.y = rotY;
      cache.x = wx; cache.z = wz; cache.rot = rotY;
    }
  }

  for (const [id, cache] of itemCache) {
    if (!seen.has(id)) {
      itemsLayer.remove(cache.node); disposeGroup(cache.node);
      itemCache.delete(id);
    }
  }

  renderSidebar();
  renderer.shadowMap.needsUpdate = true;
}

function disposeGroup(g) {
  g.traverse(o => {
    if (o.isMesh) { o.geometry.dispose(); }
  });
}

/* ════════════════════════════════════════════════════════════
   LABEL PROJECTION (each frame) — solo hitos fijos del predio
   ════════════════════════════════════════════════════════════ */
const _v = new THREE.Vector3();
function updateLabels() {
  const rect = host.getBoundingClientRect();
  for (const s of staticLabels) {
    _v.copy(s.pos); _v.project(camera);
    if (_v.z > 1) { s.el.style.display='none'; continue; }
    s.el.style.display = '';
    s.el.style.left = ((_v.x*0.5+0.5) * rect.width) + 'px';
    s.el.style.top  = ((-_v.y*0.5+0.5) * rect.height) + 'px';
  }
}

/* ════════════════════════════════════════════════════════════
   INTERACTION — raycasting, drag, select
   ════════════════════════════════════════════════════════════ */
const raycaster = new THREE.Raycaster();
const pointerNDC = new THREE.Vector2();
const groundPlane = new THREE.Plane(new THREE.Vector3(0,1,0), 0);
let drag = null; // { id, offX, offZ }

function ndcFromEvent(e) {
  const rect = host.getBoundingClientRect();
  pointerNDC.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  pointerNDC.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
}

function pickItemId(e) {
  ndcFromEvent(e);
  raycaster.setFromCamera(pointerNDC, camera);
  const hits = raycaster.intersectObjects(itemsLayer.children, true);
  for (const h of hits) {
    if (h.object.userData.itemId !== undefined) return h.object.userData.itemId;
  }
  return null;
}

function groundPoint(e) {
  ndcFromEvent(e);
  raycaster.setFromCamera(pointerNDC, camera);
  const pt = new THREE.Vector3();
  raycaster.ray.intersectPlane(groundPlane, pt);
  return pt;
}

// ── modo de interacción: "camera" (orbitar libre, ítems fijos) o
//    "items" (cámara congelada, arrastrás los ítems) ──
let interactionMode = 'camera';
const btnMode = document.getElementById('btn-mode');
const hudHint = document.getElementById('hud-hint');
function setMode(m) {
  interactionMode = m;
  btnMode.dataset.mode = m;
  btnMode.textContent = m === 'camera' ? '🎥 Mover cámara' : '✋ Mover ítems';
  controls.enableRotate = m === 'camera';
  controls.enablePan = m === 'camera';
  hudHint.textContent = m === 'camera'
    ? 'arrastrá = orbitar · scroll = zoom · click ítem = seleccionar'
    : 'arrastrá ítem = moverlo · cámara congelada · click vacío = deseleccionar';
}
btnMode.addEventListener('click', () => setMode(interactionMode === 'camera' ? 'items' : 'camera'));
setMode('camera');

renderer.domElement.addEventListener('pointerdown', e => {
  if (e.button !== 0) return;
  const id = pickItemId(e);
  if (interactionMode === 'items' && id !== null) {
    S.selId = id; render();
    const item = S.items.find(i => i.id === id);
    const pt = groundPoint(e);
    drag = { id, offX: pt.x - toWX(item.x+item.w/2), offZ: pt.z - toWZ(item.y+item.h/2) };
  } else {
    S.selId = id; render();
  }
});
window.addEventListener('pointermove', e => {
  if (!drag) return;
  const item = S.items.find(i => i.id === drag.id);
  if (!item) return;
  const pt = groundPoint(e);
  const wx = pt.x - drag.offX, wz = pt.z - drag.offZ;
  item.x = +( (wx + FW/2) - item.w/2 ).toFixed(2);
  item.y = +( (wz + FH/2) - item.h/2 ).toFixed(2);
  const cache = itemCache.get(drag.id);
  if (cache) {
    cache.node.position.set(wx, 0, wz);
    cache.x = wx; cache.z = wz;
  }
});
window.addEventListener('pointerup', () => {
  if (drag) { save(); drag = null; }
});

document.addEventListener('keydown', e => {
  if (!S.selId) return;
  const tag = document.activeElement?.tagName;
  if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') return;
  if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); del(); }
  else if (e.key === 'r' || e.key === 'R') rotate(e.shiftKey ? -15 : 15);
  else if (e.key === 'd' || e.key === 'D') dup();
  else if (e.key === 'Escape') { S.selId = null; render(); }
});

/* ════════════════════════════════════════════════════════════
   SIDEBAR
   ════════════════════════════════════════════════════════════ */
function itemSubLabel(it) {
  return `${it.w} × ${it.h} m`;
}
function itemDimsLabel(item) {
  if (item.type === 'bombita')   return `${item.w} m · tira LED · ${item.rot}°`;
  if (item.type === 'bebedero')  return `${item.w} × ${item.h} m · bebedero · ${item.rot}°`;
  if (item.type === 'reflector') return `Ø ${item.w} m · reflector · ${item.rot}°`;
  if (item.type === 'sanitario') return `6.5 × 4 m · Baño VIP · ${item.rot}°`;
  if (item.type === 'kermess')   return `Ø ${item.w} m · 10 luces · ${item.rot}°`;
  return `${item.w} × ${item.h} m · ${item.rot}°`;
}

function renderSidebar() {
  const item = S.items.find(i => i.id === S.selId);

  const panel = document.getElementById('sel-panel');
  const lightsRow = document.getElementById('lights-row');
  const lightsBtn = document.getElementById('btn-lights');
  if (item) {
    panel.classList.add('visible');
    document.getElementById('sel-name').textContent = item.label;
    document.getElementById('sel-dims').textContent = itemDimsLabel(item);
    if (item.type === 'pista') {
      lightsRow.style.display = '';
      lightsBtn.textContent  = item.lightsOn ? '💡 Luces ON' : '💡 Luces OFF';
      lightsBtn.className    = `btn btn-sm ${item.lightsOn ? 'btn-lights-on' : 'btn-lights-off'}`;
    } else {
      lightsRow.style.display = 'none';
    }
  } else {
    panel.classList.remove('visible');
    lightsRow.style.display = 'none';
  }

  document.getElementById('item-count').textContent = S.items.length;

  const listEl = document.getElementById('item-list');
  if (S.items.length === 0) {
    listEl.innerHTML = '<div class="empty">Sin ítems todavía</div>';
  } else {
    const groups = {};
    for (const it of S.items) (groups[it.type] = groups[it.type] || []).push(it);
    listEl.innerHTML = '';
    for (const type of Object.keys(TYPES)) {
      if (!groups[type]) continue;
      const items = groups[type];
      const cfg   = TYPES[type];
      const open  = groupStates[type] === true;

      const groupEl = document.createElement('div');
      groupEl.className = 'item-group';
      const hdr = document.createElement('div');
      hdr.className = `group-hdr ${open ? 'open' : 'closed'}`;
      hdr.innerHTML = `
        <div class="group-dot" style="background:${cfg.color}"></div>
        <span class="group-name">${cfg.label}</span>
        <span class="group-cnt">${items.length}</span>
        <span class="group-chev">▾</span>`;
      hdr.onclick = () => { groupStates[type] = !groupStates[type]; renderSidebar(); };

      const body = document.createElement('div');
      body.className = `group-body ${open ? 'open' : 'closed'}`;
      for (const it of items) {
        const row = document.createElement('div');
        row.className = 'item-row' + (it.id === S.selId ? ' active' : '');
        row.innerHTML = `
          <div class="item-dot" style="background:${cfg.color}"></div>
          <div class="item-text">
            <div class="item-lbl">${it.label}</div>
            <div class="item-sub">${itemSubLabel(it)}</div>
          </div>`;
        row.onclick = () => { S.selId = it.id; render(); };
        body.appendChild(row);
      }
      groupEl.append(hdr, body);
      listEl.appendChild(groupEl);
    }
  }

  const counts = {};
  for (const it of S.items) counts[it.type] = (counts[it.type] || 0) + 1;
  const statsEl = document.getElementById('stats');
  if (Object.keys(counts).length === 0) {
    statsEl.innerHTML = '<div class="empty" style="grid-column:1/-1">—</div>';
  } else {
    statsEl.innerHTML = '';
    for (const [t, n] of Object.entries(counts)) {
      const cfg  = TYPES[t] || TYPES.otro;
      const card = document.createElement('div');
      card.className = 'stat-card';
      card.innerHTML = `<div class="stat-n" style="color:${cfg.color}">${n}</div><div class="stat-l">${cfg.label}</div>`;
      statsEl.appendChild(card);
    }
  }
}

/* ════════════════════════════════════════════════════════════
   ACTIONS
   ════════════════════════════════════════════════════════════ */
function addItem() {
  const type   = document.getElementById('i-type').value;
  const rawLbl = document.getElementById('i-label').value.trim();
  const label  = rawLbl || TYPES[type].label + ' ' + S.nextId;
  const w = parseFloat(document.getElementById('i-w').value) || 2;
  const h = parseFloat(document.getElementById('i-h').value) || 2;

  const item = {
    id: S.nextId++, type, label, w, h,
    x: +(27 - w / 2).toFixed(2),
    y: +(22 - h / 2).toFixed(2),
    rot: 0,
    lightsOn: false,
  };
  S.items.push(item);
  S.selId = item.id;
  document.getElementById('i-label').value = '';
  save();
  render();
}

function del() {
  S.items = S.items.filter(i => i.id !== S.selId);
  S.selId = null;
  save(); render();
}

function dup() {
  const src = S.items.find(i => i.id === S.selId);
  if (!src) return;
  const copy = { ...src, id: S.nextId++, x: src.x + 1.5, y: src.y + 1.5 };
  S.items.push(copy);
  S.selId = copy.id;
  save(); render();
}

function rotate(delta) {
  const item = S.items.find(i => i.id === S.selId);
  if (!item) return;
  item.rot = (item.rot + delta + 360) % 360;
  save(); render();
}

document.getElementById('btn-add').onclick    = addItem;
document.getElementById('btn-lights').onclick = () => {
  const item = S.items.find(i => i.id === S.selId);
  if (!item || item.type !== 'pista') return;
  item.lightsOn = !item.lightsOn;
  save(); render();
};
document.getElementById('btn-rl').onclick  = () => rotate(-15);
document.getElementById('btn-rr').onclick  = () => rotate(15);
document.getElementById('btn-dup').onclick = dup;
document.getElementById('btn-del').onclick = del;

document.getElementById('btn-clear').onclick = () => {
  if (confirm('¿Eliminar todos los ítems del mapa?')) {
    S.items = []; S.selId = null;
    save(); render();
  }
};

document.getElementById('i-label').addEventListener('keydown', e => {
  if (e.key === 'Enter') addItem();
});

document.getElementById('i-type').addEventListener('change', e => {
  document.getElementById('i-label').placeholder =
    (TYPES[e.target.value]?.label || '') + ' 1';
  const dims = {
    bebedero:[7,1.0], bombita:[10,0.25], reflector:[0.5,0.5], pista:[6,6],
    mesaimp:[3,1], cuina:[9,2.6], barra:[4,1.2], barrafardos:[4,1.2], living:[3.5,3.5],
    livingf:[3.5,3.5], vela:[0.3,0.3], sanitario:[4.5,2.5], tractor:[3.5,2],
    dj:[2.5,1.2], trussdj:[4,0.5], fardo:[1.2,0.8], fogonero:[1.2,1.2], tronco:[5,0.8],
    rondafardos:[10,10], kermess:[10,10], texto:[3,0.5],
  };
  if (dims[e.target.value]) {
    document.getElementById('i-w').value = dims[e.target.value][0];
    document.getElementById('i-h').value = dims[e.target.value][1];
  }
  if (e.target.value === 'texto') document.getElementById('i-label').placeholder = 'Escribe el texto aquí';
  const locked = e.target.value === 'mesaimp';
  document.getElementById('i-w').disabled = locked;
  document.getElementById('i-h').disabled = locked;
});

/* ════════════════════════════════════════════════════════════
   NIGHT MODE
   ════════════════════════════════════════════════════════════ */
let nightMode = false;
let nightT = 0; // 0..1 transición suave
document.getElementById('btn-night').onclick = () => {
  nightMode = !nightMode;
  const btn = document.getElementById('btn-night');
  btn.classList.toggle('on', nightMode);
  btn.textContent = nightMode ? '☀  Subir luz' : '☾  Bajar luz';
};

/* ════════════════════════════════════════════════════════════
   CAMERA VIEW PRESETS
   ════════════════════════════════════════════════════════════ */
const VIEWS = {
  persp: { pos: [34, 27, -36], target: [0, 1, 0] },
  front: { pos: [0, 9, -50], target: [0, 3, 0] },
  side:  { pos: [50, 9, 0], target: [0, 3, 0] },
};
let camAnim = null;
function goToView(name) {
  document.querySelectorAll('.view-tab').forEach(b => b.classList.toggle('active', b.dataset.view === name));

  if (name === 'top') {
    // planta ortográfica: sin distorsión de lente, como un plano real
    camAnim = null;
    camera = orthoCamera;
    controls.object = camera;
    controls.enableRotate = false;
    camera.position.set(0, 50, 0.001);
    controls.target.set(0, 0, 0);
    camera.updateProjectionMatrix();
    controls.update();
    return;
  }

  const v = VIEWS[name];
  if (!v) return;
  camera = perspCamera;
  controls.object = camera;
  controls.enableRotate = interactionMode === 'camera';
  controls.enablePan = interactionMode === 'camera';
  camAnim = {
    dur: 750,
    fromPos: camera.position.clone(), toPos: new THREE.Vector3(...v.pos),
    fromTarget: controls.target.clone(), toTarget: new THREE.Vector3(...v.target),
    startTime: performance.now(),
  };
  controls.enabled = false;
}
document.querySelectorAll('.view-tab').forEach(btn => {
  btn.addEventListener('click', () => goToView(btn.dataset.view));
});
document.querySelector('.view-tab[data-view="persp"]').classList.add('active');

function easeInOutCubic(t) { return t < 0.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2; }

/* ════════════════════════════════════════════════════════════
   ANIMATION LOOP
   ════════════════════════════════════════════════════════════ */
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  // transición noche/día
  const targetT = nightMode ? 1 : 0;
  nightT += (targetT - nightT) * 0.06;
  hemi.intensity = 0.9 - nightT*0.62;
  sun.intensity = 1.15 - nightT*0.98;
  fill.intensity = 0.28 - nightT*0.14;
  scene.fog.density = 0.0068 + nightT*0.004;

  for (const nl of nightLights) {
    const flick = nl.light.userData.alwaysOn ? 1 : nightT;
    nl.light.intensity = nl.intensity * flick * (0.92 + Math.sin(t*6 + nl.light.id)*0.08);
  }
  scene.__casaWinMat && (scene.__casaWinMat.emissiveIntensity = 0.16 + nightT * 1.24);
  scene.__casaWinMat2 && (scene.__casaWinMat2.emissiveIntensity = 0.16 + nightT * 1.24);

  for (const f of flickerMats) {
    const flick = 0.85 + Math.sin(t*f.speed + f.phase)*0.15;
    f.m[f.prop] = f.base * nightT * flick;
  }

  // compass: apuntar norte real respecto a la cámara
  const az = Math.atan2(camera.position.x - controls.target.x, camera.position.z - controls.target.z);
  document.getElementById('hud-needle').setAttribute('transform', `rotate(${az*180/Math.PI} 22 22)`);

  if (camAnim) {
    const e = Math.min(1, (performance.now() - camAnim.startTime) / camAnim.dur);
    const k = easeInOutCubic(e);
    camera.position.lerpVectors(camAnim.fromPos, camAnim.toPos, k);
    controls.target.lerpVectors(camAnim.fromTarget, camAnim.toTarget, k);
    if (e >= 1) { camAnim = null; controls.enabled = true; }
  }

  controls.update();
  updateLabels();
  renderer.render(scene, camera);
}

resize();
camera.position.set(...VIEWS.persp.pos);
controls.target.set(...VIEWS.persp.target);
render();
animate();

document.getElementById('hud-loading').style.opacity = '0';
setTimeout(() => document.getElementById('hud-loading')?.remove(), 450);
</script>
